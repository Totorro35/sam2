[build-system]
requires = [
    "setuptools>=61.0",
    "torch>=2.5.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "sam2"
version = "1.0.0"
description = "SAM 2: Segment Anything in Images and Videos"
authors = [
  { name = "Meta AI" },
]
license = "Apache-2.0"
readme = "README.md"
urls = { "Homepage" = "https://github.com/facebookresearch/sam2" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
]

[tool.setuptools.packages.find]
include = ["sam2*"]
